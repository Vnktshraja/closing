services:
  closing-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_TAG:-${DOCKER_USERNAME:-vnktshraja96}/closing-app:latest}
    container_name: closing-app
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8089}:8089"
    environment:
      TZ: Asia/Kolkata
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Kolkata"
      SPRING_PROFILES_ACTIVE: ${PROFILE:-dev}
      SERVER_PORT: 8089
      POSTGRES_SERVER: ${POSTGRES_SERVER:-shared-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-reactive_db}
      POSTGRES_USER: ${POSTGRES_USER:-Vnktsh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Vnktsh@1}
      POSTGRES_URL: ${POSTGRES_URL:-jdbc:postgresql://${POSTGRES_SERVER:-shared-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-reactive_db}?currentSchema=reactive}
      DB_HOST: ${POSTGRES_SERVER:-shared-postgres}
      DB_PORT: ${POSTGRES_PORT:-5432}
      DB_NAME: ${POSTGRES_DB:-reactive_db}
      DB_SCHEMA: ${DB_SCHEMA:-reactive}
      DB_USERNAME: ${POSTGRES_USER:-Vnktsh}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-Vnktsh@1}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-none}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      GROWW_API_KEY: ${GROWW_API_KEY:-eyJraWQiOiJaTUtjVXciLCJhbGciOiJFUzI1NiJ9..3UONrmWIOMZkkgDPn-yM5WSvaPSVZUuyUCBPAgITdngRiZSv-iANi4tCCFz2-VuaP5Q6rg_vK8hsPZIdVmn34A}
      GROWW_API_SECRET: ${GROWW_API_SECRET:-9r0a)1FO7SDzm@*LutkD%X8kQfnPjX1G}
    networks:
      - shared-network

networks:
  shared-network:
    name: shared-network
    external: true
