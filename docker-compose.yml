# Usage:
#   docker compose --env-file dev.env up --build
#   docker compose --env-file prod.env up --build -d
name: closing

services:
  postgres:
    image: postgres:16-alpine
    container_name: closing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-reactive_db}
      POSTGRES_USER: ${DB_USERNAME:-XXXXX}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-YYYYY}
      DB_SCHEMA: ${DB_SCHEMA:-reactive}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  closing:
    build:
      context: .
      dockerfile: Dockerfile
    image: vnkst/closing:${APP_VERSION:-0.1.0}
    container_name: closing-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ${ENV_FILE:-dev.env}
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - "${SERVER_PORT:-8089}:8089"

volumes:
  postgres-data:
