spring:
  application:
    name: closing
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:${PROFILE:dev}}

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://${POSTGRES_SERVER:${DB_HOST:localhost}}:${POSTGRES_PORT:${DB_PORT:5432}}/${POSTGRES_DB:${DB_NAME:reactive_db}}?currentSchema=${DB_SCHEMA:reactive}}
    username: ${POSTGRES_USER:${DB_USERNAME:Vnktsh}}
    password: ${POSTGRES_PASSWORD:${DB_PASSWORD:Vnktsh@1}}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ClosingHikariPool
      schema: ${DB_SCHEMA:reactive}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      validation-timeout: 5000
      leak-detection-threshold: 60000
      auto-commit: true

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:reactive}
        format_sql: true
        jdbc:
          batch_size: 20
          time_zone: Asia/Kolkata
        order_inserts: true
        order_updates: true

